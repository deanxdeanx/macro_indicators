name: Refresh data

on:
  schedule:
    # 13:17 UTC, after the US morning release window. GitHub delivers schedule
    # events late when Actions is busy (the 2 Nov 2026 run was created at
    # 20:51 UTC, about nine hours after the 11:30 cron, with no queue time
    # once the event existed). :17 avoids the :00 and :30 pile-ups. A manual
    # run is Actions → Refresh data → Run workflow, and that starts immediately.
    - cron: "17 13 * * *"
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: refresh-data
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Install dependencies
        run: python -m pip install -r requirements.txt

      - name: Build data snapshot
        env:
          FRED_API_KEY: ${{ secrets.FRED_API_KEY }}
        run: python build_data.py --timeout 30

      - name: Commit updated data
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add site/data
          if git diff --cached --quiet; then
            echo "Data snapshot matches the previous commit."
          else
            git commit -m "Update macro and market data snapshot"
            git push
          fi

      - name: Upload GitHub Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: site

  deploy:
    needs: refresh
    runs-on: ubuntu-latest
    concurrency:
      group: pages
      cancel-in-progress: false
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
