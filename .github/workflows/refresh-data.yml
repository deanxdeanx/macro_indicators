name: Refresh data

on:
  schedule:
    # 13:17 UTC, after the US morning release window. GitHub delivers schedule
    # events late when Actions is busy (the 2 Nov 2026 run was created at
    # 20:51 UTC, about nine hours after the 11:30 cron, with no queue time
    # once the event existed). :17 avoids the :00 and :30 pile-ups. A manual
    # run is Actions → Refresh data → Run workflow, and that starts immediately.
    # The 3 Nov and 4 Nov 2026 runs timed out every parallel FRED CSV read while
    # Yahoo succeeded. FRED is now one series at a time, with a longer backoff,
    # and fewer retries after a timeout. If more than half of the FRED series
    # fail, the job still publishes the held-over snapshot and then fails.
    - cron: "17 13 * * *"
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: refresh-data
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 50
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Install dependencies
        run: python -m pip install -r requirements.txt

      - name: Build data snapshot
        id: build
        env:
          FRED_API_KEY: ${{ secrets.FRED_API_KEY }}
        run: python build_data.py --timeout 30

      - name: Commit updated data
        if: always() && steps.build.outcome != 'cancelled'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add site/data
          if git diff --cached --quiet; then
            echo "Data snapshot matches the previous commit."
          else
            git commit -m "Update macro and market data snapshot"
            git push
          fi

      - name: Upload GitHub Pages artifact
        id: upload
        if: always() && steps.build.outcome != 'cancelled'
        uses: actions/upload-pages-artifact@v3
        continue-on-error: true
        with:
          path: site

      - name: Wait before retrying the Pages upload
        if: always() && steps.build.outcome != 'cancelled' && steps.upload.outcome == 'failure'
        run: sleep 20

      - name: Retry GitHub Pages upload
        id: upload_retry
        if: always() && steps.build.outcome != 'cancelled' && steps.upload.outcome == 'failure'
        uses: actions/upload-pages-artifact@v3
        continue-on-error: true
        with:
          path: site

      - name: Wait before the last Pages upload
        if: always() && steps.build.outcome != 'cancelled' && steps.upload.outcome == 'failure' && steps.upload_retry.outcome == 'failure'
        run: sleep 40

      - name: Retry GitHub Pages upload again
        if: always() && steps.build.outcome != 'cancelled' && steps.upload.outcome == 'failure' && steps.upload_retry.outcome == 'failure'
        uses: actions/upload-pages-artifact@v3
        with:
          path: site

      - name: Fail when most FRED series did not refresh
        if: steps.build.outcome == 'failure'
        run: |
          echo "::error title=FRED refresh incomplete::More than half of the FRED series failed. Previous observations were kept, and this run still deploys that held-over snapshot. The series list is in the build log above."
          exit 1

  deploy:
    needs: refresh
    if: always() && (needs.refresh.result == 'success' || needs.refresh.result == 'failure')
    runs-on: ubuntu-latest
    concurrency:
      group: pages
      cancel-in-progress: false
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
        continue-on-error: true

      - name: Wait before retrying the Pages deploy
        if: steps.deployment.outcome == 'failure'
        run: sleep 20

      - name: Retry GitHub Pages deploy
        id: deployment_retry
        if: steps.deployment.outcome == 'failure'
        uses: actions/deploy-pages@v4
        continue-on-error: true

      - name: Wait before the last Pages deploy
        if: steps.deployment.outcome == 'failure' && steps.deployment_retry.outcome == 'failure'
        run: sleep 40

      - name: Retry GitHub Pages deploy again
        if: steps.deployment.outcome == 'failure' && steps.deployment_retry.outcome == 'failure'
        uses: actions/deploy-pages@v4
